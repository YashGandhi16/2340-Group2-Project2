<h1>Job board</h1>
<p><a href="{% url 'job_list' %}">Browse jobs</a></p>
<p>
  {% if user.is_authenticated %}
    <a href="{% url 'logout' %}">Log out</a>
    {% if user.profile.is_admin %}
      · <a href="{% url 'manage_users' %}">Manage users</a>
    {% endif %}
    {% if user.profile.is_recruiter %}
      · <a href="{% url 'application_list' %}">Review applications</a>
    {% endif %}
  {% else %}
    <a href="{% url 'login' %}">Log in</a>
  {% endif %}
</p>
