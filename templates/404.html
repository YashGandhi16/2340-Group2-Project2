{% extends "base.html" %}

{% block title %}Page not found{% endblock %}

{% block content %}
<section class="error-page fade-up">
  <div class="error-code">404</div>
  <h1>We couldn't find that page.</h1>
  <p>The link may be broken, or the posting may have been removed.</p>
  <div class="row">
    <a class="btn btn-primary" href="{% url 'job_list' %}"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>Browse jobs</a>
    <a class="btn" href="{% url 'home' %}">Go home</a>
  </div>
</section>
{% endblock %}
