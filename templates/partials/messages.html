{% if messages %}
  <div class="toasts" aria-live="polite">
    {% for message in messages %}
      <div class="toast toast-{{ message.tags|default:'info' }}" role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}">
        <svg class="icon" aria-hidden="true"><use href="#{% if message.tags == 'success' %}i-check-circle{% elif message.tags == 'error' or message.tags == 'warning' %}i-alert{% else %}i-info{% endif %}"/></svg>
        <div class="toast-body">{{ message }}</div>
        <button type="button" class="toast-close" aria-label="Dismiss notification">
          <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
