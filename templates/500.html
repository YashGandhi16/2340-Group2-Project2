{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong · Meridian</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  {# Rendered without a request context, so it must not depend on the user or messages. #}
  <main class="page">
    <section class="error-page">
      <div class="error-code">500</div>
      <h1>Something went wrong on our end.</h1>
      <p>Please try again in a moment.</p>
      <div class="row"><a class="btn btn-primary" href="/">Go home</a></div>
    </section>
  </main>
</body>
</html>
